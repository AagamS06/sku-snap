name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: sku-snap match examples/orders/luigis-text.txt --catalog examples/catalog.csv --customer luigis --aliases examples/aliases.csv --history examples/history.jsonl || test $? -eq 1
